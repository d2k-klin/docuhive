name: docuhive-test
services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    user: postgres
    environment:
      POSTGRES_USER: docuhive_test
      POSTGRES_PASSWORD: docuhive_test
      POSTGRES_DB: docuhive_test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: /var/lib/postgresql/data:uid=999,gid=999,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuhive_test -d docuhive_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  gotenberg:
    image: gotenberg/gotenberg:8@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    command:
      - gotenberg
      - --api-timeout=120s
      - '--chromium-deny-list=(?i)^(?!file://|data:|about:).*'
      - --libreoffice-deny-list=.*
      - --api-download-from-deny-list=.*
      - --webhook-disable=true
    ports: ["127.0.0.1:53001:3000"]
