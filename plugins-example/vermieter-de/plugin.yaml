id: vermieter-de
name: Rent and service charges (Germany)
description: For private landlords — the rent ledger, and the yearly service-charge statement per tenant built from the bills in your archive. It divides costs by the keys you choose; it does not give legal advice.
version: 0.1.0
requires_sdk: ">=1,<2"
capabilities: [documents:read, documents:create, documents:hold, mail:send, ai]
snapshot: true

taxonomy:
  document_types:
    - id: tenancy_agreement
      label: Tenancy agreement
      facts:
        - { name: tenant, type: string }
        - { name: start_date, type: date }
        - { name: rent, type: money }
        - { name: advance_payment, type: money }
        - { name: deposit, type: money }

ai_tasks:
  - { prompt: cost-type, like: classify }
