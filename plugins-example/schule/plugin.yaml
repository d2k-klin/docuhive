id: schule
name: School
description: Letters from school that still need an answer, soonest first.
version: 0.1.0
requires_sdk: ">=1,<2"
capabilities: [documents:read, documents:write-metadata]

taxonomy:
  document_types:
    - id: school_letter
      label: School letter
      description: A letter or notice from a school or nursery that asks for a reply or a signature.
      facts:
        - { name: reply_by, type: date, remind_days_before: [7, 1] }
