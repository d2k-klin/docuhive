title: { en: Contracts, de: Verträge }
description: What each contract costs, when it renews and the last day for notice. The dates are read from the contract; the law may allow a shorter period, which the plugin does not check.
nav: { label: { en: Contracts, de: Verträge }, icon: file-pen, order: 30 }
blocks:
  - type: table
    source: contracts
    columns:
      - { field: provider, label: Provider, link: { page: contract, params: { id: id } } }
      - { field: product, label: Product }
      - { field: kind_label, label: Kind }
      - { field: per_month, label: Per month, format: money, total: true }
      - { field: per_year, label: Per year, format: money, total: true }
      - { field: term_end, label: Term ends, format: date }
      - { field: notice_by, label: Notice by, format: date }
      - { field: status, label: Note, format: badge, tones: { Notice soon: warn, Dates missing: warn, Notice date passed: muted } }
      - { field: state_label, label: State, format: badge, tones: { Active: ok, Cancelled: info, Ended: muted } }
    filters:
      - { field: kind, type: choice, label: Kind, options: kinds }
      - { field: state_label, type: choice, label: State, options: [Active, Cancelled, Ended] }
      - { field: provider, type: text, label: Search }
    sort: notice_by
    empty: No contracts yet. Upload a contract and it appears here once it is read.
  - type: table
    title: Regular payments without a contract
    help: Found on your bank statements by the bank plugin. Add the ones that are contracts.
    source: unknown_recurring
    columns:
      - { field: payee, label: Paid to }
      - { field: money, label: Amount, format: money }
      - { field: rhythm, label: How often }
      - { field: last, label: Last paid, format: date }
    row_actions:
      - { label: Add as a contract, action: contract_from_payment }
      - { label: Not a contract, action: not_a_contract }
    empty: Nothing found. With the bank plugin on, regular payments without a contract appear here.
