name: E-invoices
# The release gate for issuing invoices: every XRechnung invoice the tax plugin can write is
# checked by the tax administration's own validator (KoSIT) with the official XRechnung rules.
# Versions and checksums are pinned; a rules update changes them here and in the writer.
on:
  push:
    branches: [main]
    paths: ['plugins-example/steuer-de/**', '.github/workflows/einvoice.yml']
  pull_request:
    paths: ['plugins-example/steuer-de/**', '.github/workflows/einvoice.yml']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
env:
  VALIDATOR: https://github.com/itplr-kosit/validator/releases/download/v1.6.3/validator-1.6.3-standalone.jar
  VALIDATOR_SHA256: 799e64befca97d4080e03608c80b85dd5a5ecc5f4ae4f35d1116ec2855b9a7c9
  RULES: https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/v2026-08-31/xrechnung-3.0.2-validator-configuration-2026-08-31.zip
  RULES_SHA256: 2530cd107c414511c5d0462ec10f886910395abfca820db82e83d70bf01221a8
jobs:
  xrechnung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.13
      - run: uv sync --locked --all-packages --all-extras --dev
      - name: Write every invoice the generator test covers
        run: |
          mkdir -p tmp/einvoices
          EINVOICE_CORPUS_DIR=tmp/einvoices uv run pytest plugins-example/steuer-de/tests/test_invoicing.py -q -k writer
      - name: Fetch the official validator and rules
        run: |
          curl -fsSL -o tmp/validator.jar "$VALIDATOR"
          curl -fsSL -o tmp/rules.zip "$RULES"
          echo "$VALIDATOR_SHA256  tmp/validator.jar" | sha256sum -c -
          echo "$RULES_SHA256  tmp/rules.zip" | sha256sum -c -
          mkdir -p tmp/rules && unzip -q tmp/rules.zip -d tmp/rules
      - name: Validate (every file must be acceptable)
        shell: bash  # with pipefail: the validator's own exit status counts too
        run: |
          mkdir -p tmp/report
          ls tmp/einvoices/xrechnung-*.xml > /dev/null  # refuse an empty corpus
          docker run --rm -v "$PWD/tmp:/k" -w /k eclipse-temurin:21-jre sh -c \
            'java -jar validator.jar -s rules/scenarios.xml -r rules -o report einvoices/xrechnung-*.xml' \
            | tee tmp/validator.log
          grep -qE "Rejected: +0\b" tmp/validator.log  # the validator's own summary line
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: einvoice-validation
          path: tmp/report
