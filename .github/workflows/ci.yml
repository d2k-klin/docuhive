name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.13
      - run: uv sync --locked --all-packages --all-extras --dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m 'not integration' --cov=docuhive --cov-fail-under=85
      - run: uv run python deploy/scripts/check_licenses.py
      - run: uv run pip-audit --local --skip-editable
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npm exec -- license-checker --production --failOn 'AGPL;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later' --excludePrivatePackages
      - run: npm audit --omit=dev --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 git /repo --redact
      - name: Reject tracked private files
        run: |
          if git ls-files | grep -E '(^overlay/|(^|/)\.env($|\.[^e]))'; then
            echo 'Private overlay or environment files must not be tracked.'
            exit 1
          fi
  integration:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'integration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.13
      - run: uv sync --locked --all-packages --all-extras --dev
      - run: make test-integration
      - if: always()
        run: docker compose -f deploy/compose.test.yml down
