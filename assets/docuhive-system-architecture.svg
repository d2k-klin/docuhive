<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400" role="img" aria-labelledby="title description">
<title id="title">DocuHive system architecture: documents, agents, search and storage</title>
<desc id="description">The browser uses a Next.js proxy to reach FastAPI. Mail connectors and durable PostgreSQL jobs feed a Python worker. Shared modules handle OCR and conversion, Strands agents, and separate embedding clients. PostgreSQL stores metadata, jobs, facts, vectors and application state. The planned NAS vault stores original files, PDFs, metadata and thumbnails. Knowledge-base management is in progress; planned retrieve/Ask HTTP APIs and MCP reuse the same index. Amber dashed borders and arrows mark planned or incomplete connections. Existing modules still need production integration and real-provider acceptance.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="#536744"/></marker>
  <marker id="future-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="#9a681c"/></marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #20291c; }
    .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 2.4px; fill: #5b6750; }
    .hero { font-size: 53px; font-weight: 700; }
    .section { font-size: 25px; font-weight: 700; }
    .heading { font-size: 29px; font-weight: 700; }
    .body { font-size: 23px; fill: #43513a; }
    .small { font-size: 21px; fill: #536247; }
    .pending { font-size: 22px; fill: #895b13; }
    .edge { fill: none; stroke: #536744; stroke-width: 2.5; stroke-linejoin: round; }
    .planned-edge { stroke: #9a681c; stroke-dasharray: 9 6; }
  </style>
</defs>
