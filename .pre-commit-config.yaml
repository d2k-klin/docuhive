repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: prettier
        name: prettier
        entry: npm exec -- prettier --write
        language: system
        files: '\.(tsx?|jsx?|css|json|ya?ml|md)$'
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --redact --staged
        language: system
        pass_filenames: false
