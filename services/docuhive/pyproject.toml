[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docuhive"
version = "0.1.0"
description = "Self-hosted document platform"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic>=2", "pydantic-settings>=2",
  "sqlalchemy>=2", "alembic>=1.15", "psycopg[binary]>=3.2", "pgvector>=0.3",
  "httpx>=0.28", "pyyaml>=6", "python-ulid>=3", "argon2-cffi>=23", "cryptography>=44",
  "python-multipart>=0.0.20",
  "filetype>=1.2",
]

[project.optional-dependencies]
ai = ["strands-agents[ollama,anthropic,openai,litellm]>=1.63,<2"]
mail = []  # ponytail: OAuth + Gmail/Graph via httpx (core dep), IMAP via stdlib
ocr = [
  "ocrmypdf>=16.10,<17", "pypdfium2>=4.30", "pikepdf>=9", "img2pdf>=0.6",
  "pillow>=11", "pillow-heif>=0.21", "filetype>=1.2",
]

[project.scripts]
docuhive = "docuhive.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docuhive"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "docuhive/_migrations"

[tool.hatch.build.targets.sdist]
include = ["src", "migrations", "pyproject.toml", "hatch_build.py", "README.md"]

[tool.hatch.build.hooks.custom]
