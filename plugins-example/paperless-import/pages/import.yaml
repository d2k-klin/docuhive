title: { en: Import from Paperless, de: Import aus Paperless }
description: Brings every document you can see in Paperless-ngx into your DocuHive archive. Paperless is only read, never changed.
nav: { label: { en: Paperless import, de: Paperless-Import }, icon: package, order: 90 }
access: admin
blocks:
  - type: text
    text: "First enter the Paperless address and your API token under Settings → Plugins. Then check the connection and start. Documents already here (the same file) are skipped; you can stop and start again at any time."
  - type: summary
    source: progress
  - type: actions
    show_if: is_idle
    actions:
      - { label: Check the connection, action: check }
      - { label: Start the import, action: start, primary: true, confirm: "Import every document this Paperless account can see into your archive? It runs in the background and can take a while." }
  - type: actions
    show_if: is_running
    actions:
      - { label: Stop, action: stop }
  - type: table
    title: Problems
    source: problems
    columns:
      - { field: paperless_id, label: Paperless id, format: number }
      - { field: title, label: Document }
      - { field: error, label: What went wrong }
    empty: No problems.
  - type: table
    title: Imported
    source: imported_documents
    columns:
      - { field: title, label: Document, link: { document: document_id } }
      - { field: status, label: Result, format: badge, tones: { imported: ok, duplicate: muted } }
      - { field: at, label: When, format: datetime }
    empty: Nothing imported yet.
