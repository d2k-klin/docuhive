[project]
name = "docuhive-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["docuhive"]

[tool.uv.workspace]
members = ["services/docuhive", "evals"]

[tool.uv.sources]
docuhive = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6", "ruff>=0.11",
  "mypy>=1.15", "types-PyYAML", "pip-licenses>=5", "pip-audit>=2.9",
  "pre-commit>=4",
  "pytest-socket==0.8.1", "import-linter>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["services/docuhive/tests", "tests"]
markers = [
  "integration: needs a disposable PostgreSQL and conversion service",
  "req(*ids): linked product or QA requirement IDs",
  "system: needs the isolated QA stack",
  "slow: reference-host performance or resilience check",
]
pythonpath = ["tests/system/tools"]
addopts = "-p qa_plugin --disable-socket --allow-unix-socket"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["services/docuhive/src"]
check_untyped_defs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["filetype.*", "pypdfium2.*", "pillow_heif.*", "img2pdf.*", "ocrmypdf.*", "ulid.*"]
ignore_missing_imports = true
