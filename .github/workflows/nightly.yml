name: QA nightly
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install uv==0.11.13
      - run: UV_PROJECT_ENVIRONMENT=.venv-qa uv sync --locked --all-packages --all-extras --dev
      - run: npm ci
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: make qa-up
      - run: make qa-nightly
      - if: always()
        run: make qa-trace
      - if: always()
        run: |
          mkdir -p tmp/qa
          docker compose -f deploy/compose.e2e.yml logs --no-color > tmp/qa/stack.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-nightly-evidence
          path: |
            tmp/qa/*.json
            tmp/qa/*.log
            tmp/qa/browser-results
            docs/Developer-QA/traceability.md
      - if: always()
        run: make qa-down
