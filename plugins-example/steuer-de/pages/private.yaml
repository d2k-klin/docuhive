title: { en: Receipts for your tax return, de: Belege für die Steuererklärung }
description: Tag a receipt with one of the tax tags and it is listed here under its section. You type the totals into ELSTER or give the list to your advisor.
nav: { label: { en: Household tax, de: Haushalt Steuer }, icon: house, order: 15 }
params: [year]
blocks:
  - type: table
    source: private_receipts
    columns:
      - { field: section, label: Section, format: badge }
      - { field: title, label: Receipt, link: document }
      - { field: document_date, label: Date, format: date }
      - { field: amount, label: Amount, format: money, total: true }
    filters:
      - { field: document_date, type: year, label: Year }
      - { field: section, type: text, label: Section }
    empty: "No tagged receipts. Add a tag such as tax-donations or tax-medical to a receipt."
  - type: table
    title: Rental income (Anlage V)
    help: From the landlord plugin. Depreciation and interest are not included.
    source: rental_income
    columns:
      - { field: property, label: Property }
      - { field: received, label: Rent received, format: money }
      - { field: passed_on, label: Costs passed on, format: money }
      - { field: borne, label: Costs you bore, format: money }
    empty: Nothing listed. With the landlord plugin on, your properties appear here.
  - type: table
    title: Work in your home (§ 35a)
    help: From the home and craftsmen plugin. Labour from invoices you paid by transfer, and the estimated reduction of your income tax.
    source: home_35a
    show_if: home_35a
    columns:
      - { field: label, label: Kind }
      - { field: labour, label: Labour that counts, format: money }
      - { field: reduction, label: Reduction, format: money, total: true }
    empty: No craftsman invoices in this year.
  - type: summary
    title: Health costs (außergewöhnliche Belastungen)
    help: From the health claims plugin. Bills of the year minus what your insurers paid back. Whether they reduce your tax depends on your income; the tax office works that out.
    source: health_costs
    show_if: health_costs
