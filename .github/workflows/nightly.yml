name: QA nightly
# Schedule disabled; run by hand from the Actions tab.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install uv==0.11.13
      - run: UV_PROJECT_ENVIRONMENT=.venv-qa uv sync --locked --all-packages --all-extras --dev
      - run: npm ci
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: make qa-up
      - run: make qa-nightly
      - if: always()
        run: make qa-trace
      - if: always()
        run: |
          mkdir -p tmp/qa
          docker compose -f deploy/compose.e2e.yml logs --no-color > tmp/qa/stack.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-nightly-evidence
          path: |
            tmp/qa/*.json
            tmp/qa/*.log
            tmp/qa/browser-results
            docs/Developer-QA/traceability.md
      - if: always()
        run: make qa-down
